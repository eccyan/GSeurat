name: Regression Harness

# Note: Linux/Windows builds are already validated by ci.yml on every PR.
# This workflow runs ONLY the macOS pixel-diff job — that is the unique value
# regression.yml provides over ci.yml. Adding Linux/Windows duplicates here
# would require replicating Vulkan SDK setup and would just shadow ci.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  golden-frames:
    name: Golden Frames (macOS, Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan + shaders deps
        run: brew install vulkan-headers vulkan-loader molten-vk shaderc
      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Python deps in venv
        # Use a venv to avoid PEP 668 externally-managed-environment errors on
        # the macos-14 runner (system Python is locked).
        run: |
          python3 -m venv .venv-regression
          .venv-regression/bin/pip install \
            "scikit-image>=0.19,<1.0" "Pillow>=10,<12" "numpy>=1.24,<3"
      - name: Configure
        run: cmake --preset macos-release-with-diag
      - name: Build
        run: cmake --build --preset macos-release-with-diag --target gseurat_demo
      - name: Determinism self-check
        run: .venv-regression/bin/python scripts/regression/run_harness.py --self-check
      - name: Regression diff vs baseline
        # Skipped if baseline doesn't exist yet (first run on fresh branch).
        # The job populates baseline frames on its own when the path is empty,
        # but for now we just self-check until refactor/0c-tight-determinism
        # closes the drift gap that makes 0.985-threshold diffs unreliable.
        if: ${{ hashFiles('tests/regression/baseline/main/*.png') != '' }}
        run: .venv-regression/bin/python scripts/regression/run_harness.py
             --baseline tests/regression/baseline/main
             --threshold 0.985
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diff
          path: tests/regression/diff/
